services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kitsune
    volumes:
      - kitsune_pgdata:/var/lib/postgresql/data
      - ./scripts/db-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kitsune"]
      interval: 3s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: apps/app/Dockerfile
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      KITSUNE_OWNER_URL: postgresql://kitsune_owner:kitsune_owner@db:5432/kitsune
      KITSUNE_APP_URL: postgresql://kitsune_app:kitsune_app@db:5432/kitsune
      KITSUNE_ALLOW_TEST_USER_HEADER: "1"
      KITSUNE_LOCAL_DEMO: "1"
      KITSUNE_DEMO_WORKOS_ID: local-demo-user
      KITSUNE_DEMO_EMAIL: demo@localhost
      # WorkOS vars are optional in local-demo mode; pass through if present
      # so /callback still works when you switch to real AuthKit later.
      WORKOS_API_KEY: ${WORKOS_API_KEY:-sk_test_local_demo_not_used}
      WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID:-client_local_demo_not_used}
      WORKOS_COOKIE_PASSWORD: ${WORKOS_COOKIE_PASSWORD:-local-demo-cookie-password-32chars!!}
      WORKOS_REDIRECT_URI: ${WORKOS_REDIRECT_URI:-http://localhost:8080/callback}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  kitsune_pgdata:
